<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>廃都の拳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0710;color:#fff;font-family:'DotGothic16',monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;margin:0 auto;background:#000;--u:3px}
#c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;font-size:calc(var(--u)*3);text-shadow:2px 2px 0 #000;display:none}
#pl{position:absolute;left:2.5%;top:3%;width:36%}
#en{position:absolute;right:2.5%;top:10%;width:30%;text-align:right;opacity:0;transition:opacity .2s}
#wp{display:flex;align-items:center;gap:.3em;min-height:1.2em;line-height:1.2}#wp b{font-weight:normal}#wp .pips{display:flex;gap:1px}#wp .pips i{display:block;width:calc(var(--u)*1.1);height:calc(var(--u)*1.6);background:#ffd23a;box-shadow:1px 1px 0 #000}#wp .pips i.e{background:#3a3440}#wp .pips i.lo{background:#ff4a3a}
.row{display:flex;justify-content:space-between;align-items:baseline;line-height:1.2;gap:.4em}#estar{white-space:nowrap}
.bar{height:calc(var(--u)*2.2);background:#3a0e14;border:calc(var(--u)*.45) solid #f3e6c4;box-shadow:0 0 0 1px #000;margin-top:calc(var(--u)*.6);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#ffd23a;width:100%}
#en .bar i{background:#ff7a3a;left:auto;right:0}#en .bar{margin-left:auto}#estar{color:#ffd23a;letter-spacing:.05em}
#sc{color:#ffd23a;margin-top:calc(var(--u)*.5);letter-spacing:.1em}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:calc(var(--u)*5.2);color:#fff;text-shadow:3px 3px 0 #a0201a,-1px -1px 0 #000;opacity:0;transition:opacity .3s;letter-spacing:.08em}
#msg.on{opacity:1}
#screen{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,14,.86);text-align:center;padding:4vh 6vw;box-sizing:border-box;font-size:clamp(14px,min(4.2vw,3.6vh),22px);line-height:1.75}
.title{font-size:clamp(44px,min(15vw,16vh),110px);color:#ffd23a;letter-spacing:.08em;line-height:1.1;text-shadow:.06em .06em 0 #c8302a,.12em .12em 0 #3a0e14}
.sub{color:#f3c9a0;margin:.4em 0 1em}
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:.5em;width:100%;max-width:62em;margin-top:.4em}
.hc{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:.45em .5em .5em;display:flex;flex-direction:column;align-items:center;gap:.25em}
.hc.wide{grid-column:1/-1}.ht{color:#ffd23a;font-size:.85em}.hs{image-rendering:pixelated;display:block}.hrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.1em}.ha{color:#ffd23a;font-size:.7em}
.hh{font-size:.8em;line-height:1.9;color:#fff}.hn{font-size:.68em;color:#c8c0e0;line-height:1.35}.hl{color:#c8c0e0;font-size:.85em;margin-right:.3em}.hp{color:#ffd23a;margin:0 .2em}.hd{font-size:.8em;color:#c8c0e0;margin-left:.3em}
.hk{display:inline-block;min-width:1.4em;padding:0 .35em;border:1px solid #c8c0e0;border-bottom-width:3px;border-radius:4px;background:#2a2238;color:#fff;font-size:.9em;line-height:1.4;margin:0 .1em}
.hb{display:inline-block;padding:0 .5em;border-radius:1em;color:#fff;font-size:.85em;line-height:1.5;border:2px solid rgba(255,255,255,.8);margin:0 .1em;text-shadow:1px 1px 0 #000}.hb.bp{background:#b8302a}.hb.bj{background:#2a8a4a}.hb.bs{background:#c89a1a}.hb.bl{background:#4a4a5a}
.htip{font-size:.72em;color:#c8c0e0;margin-top:.5em}
.help{font-size:.78em;color:#d9d2e6;max-width:36em}
.help p{margin:.2em 0}
.warn{color:#ffb070}
.story{max-width:30em;text-align:left}
.story p{margin:.45em 0;opacity:0;animation:fi .7s forwards}
.scene{image-rendering:pixelated;width:min(70vw,52vh);margin-bottom:.6em;border:2px solid #3a2a4a}
.endimg{width:min(92vw,62vh);border-color:#e8a060}
#screen{overflow-y:auto;justify-content:safe center;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}#screen *{touch-action:pan-y}
#cap{position:absolute;left:0;right:0;bottom:1.2%;text-align:center;pointer-events:none;display:none;font-size:calc(var(--u)*3.1);color:#fff;text-shadow:2px 2px 0 #000;padding:0 4%;line-height:1.3}#cap span{animation:capin .5s}@keyframes capin{from{opacity:0}to{opacity:1}}
#skipm{position:absolute;right:2%;top:1.5%;font-size:calc(var(--u)*2);color:#c8c0e0;pointer-events:none;display:none}
.menu{margin:.7em 0 .9em;display:flex;flex-direction:column;gap:.35em;align-items:center}.mi{padding:.3em 1.2em;border:2px solid #5a4a7a;color:#e8e0f0;min-width:14em;box-sizing:border-box;cursor:pointer;background:#1a1028}.mi.on{border-color:#ffd23a;color:#ffd23a;background:#3a1a30}.mi.on::before{content:'▶ '}.note{color:#c8c0e0;font-size:.85em}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blink{margin-top:1.2em;color:#ffd23a;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
.big{font-size:2em;color:#ffd23a;text-shadow:.06em .06em 0 #c8302a}
#pad{position:fixed;left:0;right:0;display:none;align-items:center;justify-content:space-between;padding:0 5vw;box-sizing:border-box;z-index:10}
.touch #pad{display:flex}
#pad.ov{align-items:center;opacity:1}#pad.ov #stick{margin-left:calc((var(--cw) - var(--sz))/2);margin-top:18vh}#pad.ov #btns{grid-template-columns:auto;grid-template-areas:'s' 'j' 'p';gap:calc(var(--bs)*.12);margin-top:34px;margin-right:calc((var(--cw) - var(--bs))/2)}
#pad.ov .b{border:4px solid rgba(255,255,255,.92);box-shadow:0 0 0 3px rgba(0,0,0,.7),inset 0 -6px 0 rgba(0,0,0,.25);font-weight:bold;font-size:calc(var(--bs,60px)*.25);text-shadow:-2px 0 #000,2px 0 #000,0 -2px #000,0 2px #000}
#pad.ov .b[data-k=p]{background:rgba(220,50,40,.6)}#pad.ov .b[data-k=j]{background:rgba(40,170,80,.6)}#pad.ov .b[data-k=s]{background:rgba(235,175,20,.6)}
#pad.ov #stick{background:rgba(0,0,0,.32);border:4px solid rgba(255,255,255,.88);box-shadow:0 0 0 3px rgba(0,0,0,.65)}
#pad.ov #knob{background:rgba(255,255,255,.8);border:3px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.6)}
#stick{width:var(--sz,140px);height:var(--sz,140px);border-radius:50%;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.28);position:relative;touch-action:none}
#knob{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.6);pointer-events:none}
#btns{display:grid;grid-template-columns:auto auto;grid-template-areas:'. s' 'j p';gap:calc(var(--bs,60px)*.18)}
.b{width:var(--bs,60px);height:var(--bs,60px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs,60px)*.23);white-space:nowrap;color:#fff;border:3px solid rgba(255,255,255,.45);text-shadow:1px 1px 0 #000;touch-action:none}
.b.on{transform:scale(.9);filter:brightness(1.5)}
.b[data-k=p]{background:#b8302a}.b[data-k=j]{background:#2a8a4a}.b[data-k=s]{background:#c89a1a}
#pausebtn{position:fixed;top:4px;right:6px;z-index:30;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;display:none}
#tally{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:calc(var(--u)*3.6);line-height:1.6;color:#fff;text-shadow:2px 2px 0 #000;display:none}
#hi{color:#c8c0e0;font-size:.8em;letter-spacing:.1em}
#mute{position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:30;font-size:13px;padding:3px 10px;border-radius:12px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="cap"></div><div id="skipm">決定ボタンでスキップ</div>
  <div id="hud">
    <div id="pl"><div class="row"><span>ジン</span><span id="lv"></span></div><div class="bar"><i id="php"></i></div><div id="wp"></div><div id="sc">0000000</div><div id="hi"></div></div>
    <div id="en"><div class="row"><span id="estar"></span><span id="enm"></span></div><div class="bar" id="ebar"><i id="ehp"></i></div></div>
    <div id="msg"></div>
    <div id="tally"></div>
  </div>
</div>
<div id="screen"></div>
<div id="mute">♪ 音楽：オン</div>
<div id="pausebtn">一時停止</div>
<div id="pad">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <div class="b" data-k="s" style="grid-area:s">必殺</div>
    <div class="b" data-k="j" style="grid-area:j">ジャンプ</div><div class="b" data-k="p" style="grid-area:p">パンチ</div>
  </div>
</div>

 else if(w==='nunchaku'){const a=(frame*.6)%(Math.PI*2);let ex,ey;if(fname==='swing'){ex=hx+S2(10);ey=hy+S2(2)}else if(fname==='nunback'){ex=hx-S2(10);ey=hy+S2(1)}else if(fname==='nun0'){ex=hx+Math.cos(a)*S2(8);ey=hy+Math.sin(a)*S2(8)}else{ex=hx+S2(1);ey=hy+S2(7)}
  L(hx,hy,hx+(ex-hx)*.3,hy-S2(5),'#a8682a','#d89a4a',2);pline(g,hx+1,hy,ex,ey,'#c0c8d0',1);L(ex,ey,ex+(ex-hx)*.6,ey+(ey-hy)*.6+S2(2),'#a8682a','#d89a4a',2)}
 else if(w==='chain'){let pts;if(fname==='swing'||fname==='jab')pts=[[hx,hy],[hx+S2(10),hy+S2(2)],[hx+S2(20),hy+S2(1)],[hx+S2(28),hy+S2(3)]];else if(fname==='raise')pts=[[hx,hy],[hx-S2(5),hy+S2(6)],[hx-S2(8),hy+S2(13)]];else pts=[[hx,hy],[hx+S2(1),hy+S2(6)],[hx-S2(1),hy+S2(11)]];
  for(let i=0;i<pts.length-1;i++){const[a0,b0]=pts[i],[a1,b1]=pts[i+1];const n=Math.max(1,Math.hypot(a1-a0,b1-b0)/2|0);for(let k=0;k<=n;k++){const x=Math.round(a0+(a1-a0)*k/n),y=Math.round(b0+(b1-b0)*k/n);g.fillStyle='#0c0810';g.fillRect(x-1,y-1,3,3);g.fillStyle=k&1?'#c0c8d0':'#7a8290';g.fillRect(x,y,1+(k&1),1)}}}
 else if(w==='gun'){g.fillStyle='#0c0810';g.fillRect(hx-1,hy-3,S2(9)+2,4);g.fillRect(hx,hy,3*sc,S2(3));g.fillStyle='#3a3a42';g.fillRect(hx,hy-2,S2(9),2);g.fillStyle='#8a8a92';g.fillRect(hx,hy-2,S2(9),1)}
}
function drawParts(){
 for(const q of parts){const x=Math.round(q.x-cam);
  if(q.t==='spark'){const f=q.max-q.life,r=(q.big?3:2)+f,y=Math.round(q.y);
   g.fillStyle=f<3?'#ffffff':'#ffd23a';g.fillRect(x-r,y,r*2+1,1);g.fillRect(x,y-r,1,r*2+1);
   const d=Math.round(r*.7);g.fillStyle='#ff9a3a';g.fillRect(x-d,y-d,1,1);g.fillRect(x+d,y-d,1,1);g.fillRect(x-d,y+d,1,1);g.fillRect(x+d,y+d,1,1);
   if(f<3){g.fillStyle='#ffffff';g.fillRect(x-1,y-1,3,3)}}
  else if(q.t==='boom'){const f=q.max-q.life,r=Math.max(2,Math.round(q.r*(.4+f/q.max*.8)));const col=f<3?'#ffffff':f<8?'#ffd23a':f<14?'#ff7a2a':'#5a4a4a';
   if(f>=14)g.globalAlpha=q.life/8;pcircle(g,x,Math.round(q.y-r*.6),r,col);if(f>=3&&f<14){pcircle(g,x,Math.round(q.y-r*.6),Math.max(1,r-4),f<8?'#ffffff':'#ffd23a')}g.globalAlpha=1}
  else if(q.t==='dust'){g.globalAlpha=Math.min(1,q.life/20)*.7;g.fillStyle='#b8a898';g.fillRect(x,Math.round(q.y),2,2);g.globalAlpha=1}
  else if(q.t==='smoke'){g.globalAlpha=q.life/24*.6;g.fillStyle='#8a8090';g.fillRect(x,Math.round(q.y),3,3);g.globalAlpha=1}
  else if(q.t==='deb'){g.fillStyle=q.col;g.fillRect(x,Math.round(q.y-q.z),2,2)}
  else if(q.t==='emb'){g.fillStyle=(q.life&4)?'#ffb23a':'#ff5a1e';g.fillRect(x,Math.round(q.y),1,1)}
  else if(q.t==='pop'){ptext(q.str,x-q.str.length*2,Math.round(q.y),q.life&4?'#ffffff':'#ffd23a',1)}
 }
}
function drawSpecialFx(){
 const p=P,cx=Math.round(p.x-cam),cy=Math.round(p.y-20),r=10+p.t*1.3,cols=['#ffffff','#7ff0ff','#ffd23a'];
 for(let k=0;k<2;k++){const rr=r-k*6;if(rr<4)continue;for(let a=0;a<64;a++){const an=a/64*Math.PI*2+p.t*.2;g.fillStyle=cols[(a+k+(p.t>>2))%3];g.fillRect(Math.round(cx+Math.cos(an)*rr),Math.round(cy+Math.sin(an)*rr*.42),2,1)}}
 g.globalAlpha=.25;pellipse(g,cx,cy,14,20,'#bff8ff');g.globalAlpha=1;
}
function drawRain(){
 g.fillStyle='#aabbdd';g.globalAlpha=.42;
 for(let i=0;i<120;i++){const sp=5+(i%3),x=Math.floor(((i*73.13+frame*1.6)%(W+40))-20),y=Math.floor(((i*41.77+i*i*.37+frame*sp)%(H+20))-10);g.fillRect(x,y,1,3);g.fillRect(x-1,y+3,1,3)}
 g.globalAlpha=.55;g.fillStyle='#c8d8f0';
 for(let i=0;i<16;i++){const r1=Math.abs(Math.sin(frame*12.9898+i*78.233)*43758.5453)%1,r2=Math.abs(Math.sin(frame*39.346+i*11.135)*24634.634)%1;const x=Math.floor(r1*W),y=Math.floor(128+r2*52);g.fillRect(x-1,y,1,1);g.fillRect(x+1,y,1,1);g.fillRect(x,y-1,1,1)}
 g.globalAlpha=1}
function render(){
 if(mode==='movie'){renderMovie();return}
 g.fillStyle='#000';g.fillRect(0,0,W,H);
 if(!S)return;
 let ox=0,oy=0;if(shake>0){ox=Math.round((Math.random()*2-1)*shake);oy=Math.round((Math.random()*2-1)*shake)}
 g.save();g.translate(ox,oy);
 if(S.shaft){const TL=S.TL,o=Math.floor(S.ev)%TL,k=Math.floor(S.ev/TL);g.drawImage(S.shaft,0,o-TL);g.drawImage(S.shaft,0,o);ptext(String(3+k),214,o+30,'#e8c040',2);ptext(String(4+k),214,o-TL+30,'#e8c040',2);
  g.globalAlpha=.25;g.fillStyle='#000';g.fillRect(0,0,W,12);g.fillRect(0,96,W,10);g.globalAlpha=1}
 else{g.drawImage(S.sky,0,0);
 g.drawImage(S.far,S.fixed?0:-Math.round(cam*.2),0);
 g.drawImage(S.mid,S.fixed?0:-Math.round(cam*.5),0);}
 g.drawImage(S.stage,S.fixed?0:-Math.round(cam),0);
 for(const d of (S.doors||[])){if(d.open<=0)continue;const sx=Math.round(d.x-cam-d.w/2);if(sx<-20||sx>W+20)continue;const k=d.open>70?(80-d.open)/10:(d.open<10?d.open/10:1);const ow=Math.round(d.w*k);
  g.fillStyle='#07050a';g.fillRect(sx,d.top,ow,d.h);g.fillStyle='#1a1420';g.fillRect(sx,d.top,ow,2);if(ow>0){g.fillStyle='#0c0810';g.fillRect(sx+ow-1,d.top-1,3,d.h+1);g.fillStyle='#8a5430';g.fillRect(sx+ow,d.top,1,d.h)}}
 for(const l of S.lamps){const sx=Math.round(l.x-cam);if(sx<-60||sx>W+60)continue;g.globalAlpha=.07;g.fillStyle='#ffe8b0';g.beginPath();g.moveTo(sx-2,l.y);g.lineTo(sx+2,l.y);g.lineTo(sx+26,150);g.lineTo(sx-26,150);g.fill();g.globalAlpha=.12;pcircle(g,sx,l.y,5,'#fff0c0');g.globalAlpha=1}
 for(const f of S.fires){const sx=Math.round(f.x-cam);if(sx>-30&&sx<W+30)drawFire(sx,f.y,f.nd)}
 drawFxGround();
 const list=ents.filter(e=>!e.remove);if(P)list.push(P);list.sort((a,b)=>a.y-b.y);
 for(const e of list){if(e.kind==='barrel')drawBarrel(e);else if(e.kind==='item')drawItem(e);else if(e.kind==='weapon')drawWeaponItem(e);else drawEnt(e)}
 if(P&&P.st==='special')drawSpecialFx();
 drawFxAir();
 drawParts();
 if(S.th.rain)drawRain();
 if(S.shaft&&S.travelT>0&&mode==='play'&&((frame>>4)&1)){for(let pass=0;pass<2;pass++){g.fillStyle=pass?'#ffd23a':'#1a0a10';for(let i=0;i<9;i++)g.fillRect(W/2-i+(pass?0:1),24+i+(pass?0:1),i*2+1,1);g.fillRect(W/2-3+(pass?0:1),33+(pass?0:1),7,8)}}
 if(mode==='play'&&goT>0&&(96-goT)%32<20){if(S.th.rev){ptext('GO',34,40,'#ffd23a',3);for(let pass=0;pass<2;pass++){g.fillStyle=pass?'#ffd23a':'#1a0a10';for(let i=0;i<8;i++)g.fillRect(27-i+(pass?0:1),40+i+(pass?0:1)-1,1,17-2*i)}}else{ptext('GO',W-56,40,'#ffd23a',3);for(let pass=0;pass<2;pass++){g.fillStyle=pass?'#ffd23a':'#1a0a10';for(let i=0;i<8;i++)g.fillRect(W-28+i+(pass?0:1),40+i+(pass?0:1)-1,1,17-2*i)}}}
 g.restore();
 if(S.fade>0){g.globalAlpha=Math.min(1,S.fade);g.fillStyle='#000';g.fillRect(0,0,W,H);g.globalAlpha=1}
 if(S.lf>0){g.globalAlpha=Math.min(.5,S.lf*.05);g.fillStyle='#c8d8ff';g.fillRect(0,0,W,H);g.globalAlpha=1}
 if(flashT>0){g.globalAlpha=flashT*.08;g.fillStyle='#ffffff';g.fillRect(0,0,W,H);g.globalAlpha=1}
 if(mode!=='play'){g.globalAlpha=.25;g.fillStyle='#000';g.fillRect(0,0,W,H);g.globalAlpha=1}
}
let acc=0,last=performance.now();
function loop(now){requestAnimationFrame(loop);let dt=now-last;last=now;if(dt>100)dt=100;acc+=dt;let n=0;while(acc>=16.667&&n<5){update();acc-=16.667;n++}render()}
document.addEventListener('visibilitychange',()=>{last=performance.now();acc=0;if(!document.hidden&&AC&&!paused){try{AC.resume()}catch(e){}}});
document.addEventListener('pointerdown',()=>{if(AC&&AC.state!=='running'&&!paused){try{AC.resume()}catch(e){}}},true);
window.__dbg=()=>({mode,P,ents,fx,cam,lock,waveI,score,lives,stageIdx,S});
toTitle();
requestAnimationFrame(loop);
</script>
