const stick=$('#stick'),nub=$('#nub');let stickId=null;function moveStick(e){if(stickId!==e.pointerId)return;let b=stick.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height/2),rad=b.width*.30,a=Math.min(1,rad/Math.max(1,Math.hypot(dx,dy)));nub.style.transform=`translate(calc(-50% + ${dx*a}px),calc(-50% + ${dy*a}px))`;touch.left=dx<-rad*.24;touch.right=dx>rad*.24;touch.up=dy<-rad*.24;touch.down=dy>rad*.24;if(player?.grippedBy)escapeGrip(1)}stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',moveStick);function releaseStick(e){if(stickId!==e.pointerId)return;stickId=null;nub.style.transform='translate(-50%,-50%)';touch.left=touch.right=touch.up=touch.down=false}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);

let lastTouch=0;document.addEventListener('touchmove',e=>{if(mode!=='title'&&mode!=='select')e.preventDefault()},{passive:false});document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();let now=Date.now();if(now-lastTouch<300&&e.target.closest('#game,#mobileControls'))e.preventDefault();lastTouch=now},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault());
